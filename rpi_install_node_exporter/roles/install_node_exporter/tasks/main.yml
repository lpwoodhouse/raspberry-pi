---
- name: Require a separately verified SHA-256 checksum
  ansible.builtin.assert:
    that:
      - node_exporter_checksum | default('') is match('^sha256:[a-fA-F0-9]{64}$')
    fail_msg: Supply node_exporter_checksum from the trusted release checksum for download_url.

- name: Create install directory
  ansible.builtin.file:
    path: "{{ install_path }}"
    state: directory
    mode: '0755'

- name: Download and verify archive
  ansible.builtin.get_url:
    url: "{{ download_url }}"
    dest: "{{ install_path }}/node_exporter.tar.gz"
    checksum: "{{ node_exporter_checksum }}"
    mode: '0644'

- name: Extract verified exporter
  ansible.builtin.unarchive:
    src: "{{ install_path }}/node_exporter.tar.gz"
    dest: "{{ install_path }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  notify: Restart node exporter

- name: Create systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart node exporter

- name: Apply service changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start node exporter
  ansible.builtin.systemd:
    name: node_exporter.service
    daemon_reload: true
    enabled: true
    state: started

- name: Check metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ web_port }}/metrics"
